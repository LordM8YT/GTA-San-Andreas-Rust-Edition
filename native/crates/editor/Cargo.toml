[package]
name = "sa-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SARE Build Mode: world projects, undo/redo, asset catalog and viewport maths, without any GPU or UI code"

[dependencies]
anyhow.workspace = true
glam.workspace = true
sa-lua = { path = "../lua" }
sa-scene = { path = "../scene", features = ["scripts"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
png = "0.18"
sha2 = "0.10.9"
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

