[package]
name = "sa-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
bytemuck.workspace = true
glam.workspace = true
pollster.workspace = true
wgpu.workspace = true
winit.workspace = true
sa-assets = { path = "../assets" }
sa-scene = { path = "../scene", features = ["scripts"] }
sa-script = { path = "../script" }
png = "0.18"
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = { version = "0.36.2", default-features = false }
gilrs = { version = "0.11.2", default-features = false, features = ["xinput"] }
sa-audio = { path = "../audio" }
sa-net = { path = "../net" }
sa-lua = { path = "../lua" }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }

sa-client = { path = "../client" }
sa-editor = { path = "../editor" }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "pollster"] }

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }
