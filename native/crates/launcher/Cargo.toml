[package]
name = "sa-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
egui = "0.36.2"
egui-phosphor = { version = "0.14.0", default-features = false, features = ["regular", "fill"] }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "accesskit"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "pollster"] }
sa-client = { path = "../client" }
sa-scene = { path = "../scene" }
sa-editor = { path = "../editor" }
sa-net = { path = "../net" }
ed25519-dalek = "2.2"
serde_json = "1"
gilrs = { version = "0.11.2", default-features = false, features = ["xinput"] }

png = "0.18"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10.9"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
