[package]
name = "sa-launcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "accesskit"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "pollster"] }
sa-client = { path = "../client" }
sa-net = { path = "../net" }
serde_json = "1"
gilrs = { version = "0.11.2", default-features = false, features = ["xinput"] }

png = "0.18"
