[package]
name = "sa-net"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The directory's world publishing (docs/sare-directory.md): ZIP checks and
# the GitHub storage the official directory uses. Only `sa-directory` needs it.
directory = ["dep:ureq", "dep:zip"]

[[bin]]
name = "sa-directory"
required-features = ["directory"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
sha2 = "0.10.9"
ed25519-dalek = "2.2"
ureq = { version = "3.4", default-features = false, features = ["rustls"], optional = true }
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }

[dev-dependencies]
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
