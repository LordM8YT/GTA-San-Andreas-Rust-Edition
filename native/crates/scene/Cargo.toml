[package]
name = "sa-scene"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
sa-assets = { path = "../assets" }
sa-script = { path = "../script" }
sa-net = { path = "../net" }
glam.workspace = true
bytemuck.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
png = "0.18"
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std", "x86", "neon"] }
zune-core = "0.5.3"
quick-xml = "0.41"
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names"] }
sa-lua = { path = "../lua", optional = true }

[features]
# World scripts (`world_scripts`): the game and the server run them.
scripts = ["dep:sa-lua"]

