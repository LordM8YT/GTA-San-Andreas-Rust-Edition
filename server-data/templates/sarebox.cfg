# SARE server configuration - same syntax and layout as a FiveM server.cfg.
# Template: SARE Box (saved characters, money, jobs and an admin menu).
# Start with start-server.cmd, or: sa-server +exec server.cfg

# Game endpoint. SARE gameplay uses TCP; rcon answers over UDP on the same port.
# Allow TCP+UDP 7777 in the firewall / router for internet hosting.
endpoint_add_tcp "0.0.0.0:7777"
endpoint_add_udp "0.0.0.0:7777"

# These resources start when the server starts. Order matters.
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sare-map-grove
ensure [sarebox]

# Uncomment to share native car/ped/map resources from resources/[local].
# ensure my-native-car

# Server name (1-24 characters) and player slots (1-20).
sv_hostname "SARE Box"
sets sv_projectName "SARE Box"
sets sv_projectDesc "San Andreas Rust Edition roleplay"
sets tags "sarebox, roleplay"
sets locale "nb-NO"
sv_maxclients 20

# Paychecks every N minutes (see resources/[sarebox]/sarebox_core/shared/config.lua).
# Characters are saved in kvp/sarebox_core.json next to this file.

# Server browser and join codes through a SARE relay (no port forwarding).
# set sv_relay "192.168.1.10:7778"
# Hide from the relay browser; players then need the join code.
# sv_master1 ""

# Packaged servers install new GitHub releases by themselves while no players
# are online (start-server.cmd/.sh restarts them). Uncomment to disable.
# set sv_autoUpdate false

# Remote console password. Leave empty to disable rcon.
rcon_password ""

# Permissions. The console always has every permission.
add_ace group.admin command allow
add_ace group.admin command.quit deny
# Admins keep their rights between sessions by license. Type /id in game to
# see yours, then add it here:
#   add_principal identifier.license:0123abcd... group.admin
# Or for this session only, from the console:
#   add_principal player.3 group.admin

# A server icon is accepted for FiveM compatibility, not shown yet.
# load_server_icon myLogo.png
