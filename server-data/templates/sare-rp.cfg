# SARE server configuration - same syntax and layout as a FiveM server.cfg.
# Template: SARE RP Town, a roleplay server on its own map (no GTA files).
# Start with start-server.cmd, or: sa-server +exec server.cfg
#
# Players need the free "SARE RP Town" content pack (content/sare-rp-town)
# and join with:  sa-runtime --content sare-rp-town --join <address>:7777
# See resources/[sare-rp]/README.md.

# Game endpoint. SARE gameplay uses TCP; rcon answers over UDP on the same port.
# Allow TCP+UDP 7777 in the firewall / router for internet hosting.
endpoint_add_tcp "0.0.0.0:7777"
endpoint_add_udp "0.0.0.0:7777"

# These resources start when the server starts. Order matters.
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sarebox_core
ensure sarebox_admin
ensure [sare-rp]

# Server name (1-24 characters) and player slots (1-20).
sv_hostname "SARE RP Town"
sets sv_projectName "SARE RP Town"
sets sv_projectDesc "Roleplay on the SARE RP Town map: jobs, bank, shops, cars"
sets tags "roleplay, sare-rp, standalone"
sets locale "en-US"
# The content pack players need. Shown in the server info; the game does not
# download or check packs yet, so tell players to install it.
sets content_pack "sare-rp-town"
sv_maxclients 20

# Characters, money, inventories, IDs and cars are saved in kvp/*.json next to
# this file (SARE Box). Back up that folder and server.key.
set sarebox_migration admin

# Server browser and join codes through a SARE relay (no port forwarding).
# set sv_relay "192.168.1.10:7778"
# Hide from the relay browser; players then need the join code.
# sv_master1 ""

# Packaged servers install new GitHub releases by themselves while no players
# are online (start-server.cmd/.sh restarts them). Uncomment to disable.
# set sv_autoUpdate false

# Remote console password. Leave empty to disable rcon.
rcon_password ""

# Permissions. The console always has every permission.
add_ace group.admin command allow
add_ace group.admin command.quit deny
# Make yourself admin: join, type /id, then add your license here:
#   add_principal identifier.license:0123abcd... group.admin
# Hire police and EMS (whitelisted jobs) from the console or as admin:
#   setjob <server id> police 0      setjob <server id> ambulance 0
