# Render Blueprint for the official SARE directory (friends and online
# status). See docs/sare-directory.md. Free plan, no card needed.
services:
  - type: web
    name: sare-directory
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./native
    dockerfilePath: ./native/crates/net/directory.Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    # World publishing (docs/sare-directory.md#publish-to-discover). The
    # token is a secret: set it on the service page, never in this file.
    envVars:
      - key: SARE_WORLDS_REPO
        value: LordM8YT/sare-worlds
      - key: SARE_WORLDS_TOKEN
        sync: false
      - key: SARE_WORLDS_ADMINS
        sync: false
