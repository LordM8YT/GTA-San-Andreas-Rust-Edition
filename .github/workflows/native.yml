name: Native Windows and Linux
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - name: Linux audio and controller dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev libdbus-1-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build GTA V extractor
        working-directory: .
        run: dotnet build tools/gta5-extract/Gta5Extract.csproj -c Release -p:RestoreLockedMode=true
      - run: cargo build -p sa-assets --example audit_resource
      - name: Conversion tests
        working-directory: .
        run: python -m unittest discover -s tools/tests -v
      - run: cargo build --release -p sa-runtime
