name: Native Windows and Linux
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - name: Linux audio and controller dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev libdbus-1-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build GTA V extractor
        working-directory: .
        run: dotnet build tools/gta5-extract/Gta5Extract.csproj -c Release -p:RestoreLockedMode=true
      - run: cargo build -p sa-assets --example audit_resource
      - name: Conversion tests
        working-directory: .
        run: python -m unittest discover -s tools/tests -v
      - run: cargo build --release --workspace
      - name: Package review client
        working-directory: .
        run: python tools/package-client.py --platform ${{ runner.os == 'Windows' && 'windows' || 'linux' }}
      - uses: actions/upload-artifact@v4
        with:
          name: SARE-${{ runner.os }}-test
          path: native/target/packages/*.zip
          if-no-files-found: error
  publish-client:
    needs: native
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: SARE-*-test
          merge-multiple: true
          path: client-packages
      - name: Publish tested client packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Do not publish an older concurrent build after main has advanced.
          test "$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)" = "$GITHUB_SHA"
          test -f client-packages/SARE-windows-test.zip
          test -f client-packages/SARE-linux-test.zip
          tag="client-$GITHUB_SHA"
          # A rerun of an already-published commit must not mutate release assets.
          existing=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$existing" = "false" ]; then
            echo "Client release already exists. Keeping its original packages."
            exit 0
          fi
          if [ "$existing" != "true" ]; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "SARE client ${GITHUB_SHA:0:12}" --draft --notes-file docs/client-release-notes.md
          fi
          gh release upload "$tag" --clobber client-packages/SARE-windows-test.zip client-packages/SARE-linux-test.zip
          gh release edit "$tag" --draft=false --latest
